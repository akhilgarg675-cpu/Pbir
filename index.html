<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Prerna's Birthday</title>
<meta name="theme-color" content="#1c1020">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen scene at a time (open, balloons, cake, letter), dusk-plum ground, rose-gold accents. */
:root {
  color-scheme: dark;
  --bg: #1c1020;
  --bg-2: #3a1a3c;
  --fg: #f8eaef;
  --muted: #cfb3c0;
  --rose: #eaa3b8;
  --gold: #ecc9a4;
  --berry: #4a4aa8;
  --paper: #fbeee9;
  --ink: #3a1f33;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Jost", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
.app {
  position: relative; height: 100%; overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% 0%, var(--bg-2) 0%, transparent 62%),
    radial-gradient(90% 60% at 50% 110%, #4b1f3f 0%, transparent 60%),
    var(--bg);
}
.stage {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding-inline: 20px; padding-block: 24px; overflow-y: auto; overflow-x: hidden;
  animation: stageIn .7s ease both;
}
@keyframes stageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

h1, h2, .display { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; }
.eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin: 0; }
.hint { color: var(--muted); font-size: 1rem; line-height: 1.5; text-align: center; margin: 0; min-height: 3em; max-width: 24rem; text-wrap: balance; }

.btn {
  font-family: var(--body); font-weight: 600; font-size: 1.02rem; letter-spacing: .02em;
  border: 0; border-radius: 999px; padding: 15px 30px; cursor: pointer; touch-action: manipulation;
  background: var(--rose); color: #2a1230; box-shadow: 0 10px 30px -10px rgba(234,163,184,.7);
}
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px rgba(248,234,239,.35); }
.btn:focus-visible, .balloon:focus-visible, .candle:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ---------- Open ---------- */
#intro { justify-content: center; text-align: center; gap: 18px; }
#intro .heart { width: 74px; height: 74px; animation: beat 1.8s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.12); } 28% { transform: scale(1); } 42% { transform: scale(1.08); } 70% { transform: scale(1); } }
#intro h1 { font-size: clamp(3.4rem, 18vw, 6.6rem); font-style: italic; line-height: .95; color: var(--fg); }
#intro .greet { font-family: var(--display); font-size: 1.5rem; color: var(--rose); margin: 0; }
#intro .note { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }

/* ---------- Balloons ---------- */
#balloons { gap: 10px; text-align: center; }
#balloons h2 { font-size: 2rem; font-style: italic; margin-top: 8px; }
.field { position: relative; width: 100%; max-width: 440px; flex: 1; min-height: 360px; }
.balloon {
  position: absolute; width: 68px; height: 84px; border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.6), transparent 26%), var(--c);
  box-shadow: inset -9px -12px 20px rgba(0,0,0,.22);
  animation: bob 4.2s ease-in-out infinite; animation-delay: var(--d);
}
.balloon::before { content: ""; position: absolute; left: 50%; top: 97%; width: 12px; height: 9px; margin-left: -6px; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 64px; background: rgba(248,234,239,.35); transform-origin: top; }
.balloon.pop { animation: popOut .28s ease-out forwards; pointer-events: none; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
@keyframes popOut { to { transform: scale(1.5); opacity: 0; } }
#left { font-family: var(--display); font-size: 1.35rem; color: var(--gold); margin: 0; min-height: 1.6em; }

/* ---------- Cake ---------- */
#cake { justify-content: center; gap: 14px; text-align: center; }
#cake h2 { font-size: 1.9rem; font-style: italic; }
#cakeSvg { width: min(100%, 420px); height: auto; overflow: visible; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.88, 1.1) rotate(3deg); } }
.candle { cursor: pointer; outline: none; }
.candle .smoke { opacity: 0; }
.candle.out .flame { opacity: 0; animation: none; }
.candle.out .smoke { animation: smoke 1.7s ease-out; }
@keyframes smoke { 0% { opacity: .8; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-26px); } }
.candles { transition: opacity 1.2s ease; }
.candles.gone { opacity: 0; pointer-events: none; }
#slice { transition: transform 1.1s cubic-bezier(.3,.9,.3,1); }
#slice.out { transform: translate(78px, 12px); }
#gapFace { opacity: 0; transition: opacity .3s .5s; }
#gapFace.on { opacity: 1; }
.knifeLine { stroke: var(--paper); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 150; stroke-dashoffset: 150; opacity: 0; }
.knifeLine.draw { opacity: .9; animation: drawLine .6s ease-out forwards, fadeLine .5s .8s forwards; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes fadeLine { to { opacity: 0; } }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 54px; }

/* ---------- Letter ---------- */
#letter { padding-block: 28px 36px; gap: 20px; }
.paper {
  width: 100%; max-width: 34rem; background: var(--paper); color: var(--ink); border-radius: 6px;
  padding: 34px 28px 30px; box-shadow: 0 30px 60px -25px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.4) inset;
  font-family: var(--display); font-size: 1.32rem; line-height: 1.55; font-weight: 500;
  background-image: linear-gradient(180deg, rgba(234,163,184,.18), transparent 120px);
}
.paper .date { font-family: var(--body); font-size: .72rem; letter-spacing: .26em; text-transform: uppercase; color: #8a5a73; margin: 0 0 18px; }
.paper .to { font-size: 2.1rem; font-style: italic; margin: 0 0 14px; line-height: 1.1; }
.paper p { margin: 0 0 14px; }
.paper .sign { margin-top: 22px; margin-bottom: 0; font-style: italic; }
.paper .sign strong { display: block; font-size: 2rem; font-weight: 600; margin-top: 4px; color: #8b2f55; }
.line { animation: rise .9s ease both; animation-delay: calc(var(--i) * .85s); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Effects + controls ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.h { position: fixed; top: -24px; animation: fall var(--dur) linear forwards; animation-delay: var(--dl); will-change: transform; }
@keyframes fall { to { transform: translate3d(var(--dx), 112vh, 0) rotate(360deg); } }
.bit { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: burst .6s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
#mute {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; z-index: 30;
  font: 500 .8rem var(--body); letter-spacing: .06em; color: var(--fg); background: rgba(28,16,32,.55);
  border: 1px solid rgba(248,234,239,.28); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .h { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <button id="mute" type="button" hidden>Sound on</button>

  <section class="stage" id="intro">
    <svg class="heart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 56 C10 40 4 28 4 20 C4 11 11 6 18 6 C24 6 29 9 32 15 C35 9 40 6 46 6 C53 6 60 11 60 20 C60 28 54 40 32 56 Z" fill="none" stroke="#ecc9a4" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <p class="eyebrow">12 October</p>
    <h1>Prerna</h1>
    <p class="greet">Happy Birthday</p>
    <button class="btn" id="openBtn" type="button">Tap to open</button>
    <p class="note">Turn your sound on, and silent mode off.</p>
  </section>

  <section class="stage" id="balloons" hidden>
    <h2>Pop the balloons</h2>
    <div class="field" id="field"></div>
    <p id="left" aria-live="polite"></p>
  </section>

  <section class="stage" id="cake" hidden>
    <h2>Blueberry cheesecake</h2>
    <svg id="cakeSvg" viewBox="0 0 360 290" role="img" aria-label="A blueberry cheesecake with five candles">
      <defs>
        <linearGradient id="gFill" x1="0" x2="1"><stop offset="0" stop-color="#f3d6cf"/><stop offset=".35" stop-color="#fff3ea"/><stop offset="1" stop-color="#ecc7c4"/></linearGradient>
        <linearGradient id="gCrust" x1="0" x2="1"><stop offset="0" stop-color="#7f4f27"/><stop offset=".4" stop-color="#b57a43"/><stop offset="1" stop-color="#744623"/></linearGradient>
        <linearGradient id="gTop" x1="0" x2="1"><stop offset="0" stop-color="#2d2b78"/><stop offset=".45" stop-color="#4f4fb0"/><stop offset="1" stop-color="#2a2873"/></linearGradient>
        <radialGradient id="gBerry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8a8be0"/><stop offset=".5" stop-color="#3a3a9a"/><stop offset="1" stop-color="#1f1e5c"/></radialGradient>
        <clipPath id="keep"><rect x="0" y="0" width="190" height="290"/><rect x="235" y="0" width="125" height="290"/></clipPath>
        <clipPath id="sl"><rect x="190" y="90" width="45" height="200"/></clipPath>
        <g id="cakeBody">
          <rect x="80" y="128" width="200" height="78" fill="url(#gFill)"/>
          <path d="M80 200 L80 226 A100 14 0 0 0 280 226 L280 200 Z" fill="url(#gCrust)"/>
          <path d="M80 128 q0 26 10 26 q10 0 10 -14 q4 30 16 30 q12 0 12 -20 q6 22 18 22 q10 0 10 -16 q10 24 22 24 q12 0 12 -22 q8 20 20 20 q10 0 10 -18 q10 18 20 18 q12 0 12 -26 L280 150 L280 128 Z" fill="url(#gTop)"/>
          <ellipse cx="180" cy="128" rx="100" ry="16" fill="url(#gTop)"/>
          <ellipse cx="150" cy="124" rx="34" ry="4" fill="#fff" opacity=".12"/>
          <g fill="url(#gBerry)">
            <circle cx="112" cy="130" r="7"/><circle cx="140" cy="135" r="7"/><circle cx="166" cy="130" r="7"/><circle cx="194" cy="136" r="7"/>
            <circle cx="220" cy="130" r="7"/><circle cx="248" cy="134" r="7"/><circle cx="152" cy="121" r="6"/><circle cx="208" cy="121" r="6"/>
          </g>
        </g>
      </defs>
      <ellipse cx="180" cy="232" rx="150" ry="22" fill="#f3e6e6"/>
      <ellipse cx="180" cy="232" rx="132" ry="15" fill="#e6cfd3"/>
      <g id="gapFace">
        <rect x="190" y="136" width="45" height="68" fill="#e9c2bd"/>
        <rect x="190" y="200" width="45" height="26" fill="#6a3f1e"/>
        <rect x="190" y="128" width="45" height="14" fill="#2a2873"/>
      </g>
      <g clip-path="url(#keep)"><use href="#cakeBody"/></g>
      <g id="slice" clip-path="url(#sl)"><use href="#cakeBody"/></g>
      <line class="knifeLine" id="k1" x1="190" y1="98" x2="190" y2="244"/>
      <line class="knifeLine" id="k2" x1="235" y1="98" x2="235" y2="244"/>
      <g class="candles" id="candles"></g>
    </svg>
    <p class="hint" id="cakeHint" aria-live="polite">Tap the candles, or blow them all out.</p>
    <div class="actions">
      <button class="btn" id="blowBtn" type="button">Blow out the candles</button>
      <button class="btn" id="cutBtn" type="button" hidden>Cut the cake</button>
      <button class="btn" id="letterBtn" type="button" hidden>Read my letter</button>
    </div>
  </section>

  <section class="stage" id="letter" hidden>
    <article class="paper" id="paper"></article>
    <div class="actions">
      <button class="btn" id="replayBtn" type="button">Play the song</button>
      <button class="btn ghost" id="againBtn" type="button">Start over</button>
    </div>
  </section>

  <div id="fx" aria-hidden="true"></div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var stages = ['intro', 'balloons', 'cake', 'letter'];
  var COLORS = ['#eaa3b8', '#ecc9a4', '#7b7be0', '#b23a62', '#c9a6e8', '#fbeee9', '#f08aa5'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(id) {
    stages.forEach(function (s) { var el = $('#' + s); el.hidden = s !== id; if (s === id) { el.scrollTop = 0; } });
  }

  /* ---------- Audio (synthesised, no files) ---------- */
  var ctx = null, master = null, muted = false;
  function initAudio() {
    if (ctx) { if (ctx.state === 'suspended') { ctx.resume(); } return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      if (ctx.state === 'suspended') { ctx.resume(); }
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) { ctx = null; }
  }
  function tone(freq, t, dur, vol) {
    if (!ctx) { return; }
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o1.type = 'sine'; o1.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.28;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function noise(dur) {
    var n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) { d[i] = Math.random() * 2 - 1; }
    var src = ctx.createBufferSource(); src.buffer = buf; return src;
  }
  function popSound() {
    if (!ctx) { return; }
    var t = ctx.currentTime, src = noise(0.16), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 1700 + Math.random() * 900; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  function whoosh() {
    if (!ctx) { return; }
    var t = ctx.currentTime, src = noise(0.9), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2200, t + 0.4); f.frequency.exponentialRampToValueAtTime(200, t + 0.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  function chime() {
    if (!ctx) { return; }
    var t = ctx.currentTime; tone(880, t, 0.9, 0.18); tone(1318.5, t + 0.12, 1.1, 0.14); tone(1760, t + 0.24, 1.2, 0.1);
  }
  // Happy Birthday, in C, as a slow music box (the tune is public domain).
  var TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
              [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
              [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1.5],
              [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2.5]];
  function playTune() {
    if (!ctx) { return; }
    var spb = 60 / 92, t = ctx.currentTime + 0.1;
    TUNE.forEach(function (n) { tone(n[0], t, Math.max(n[1] * spb * 1.5, 0.5), 0.22); t += n[1] * spb; });
    tone(130.81, ctx.currentTime + 0.1, 3, 0.1);
  }

  /* ---------- Effects ---------- */
  function hearts(n) {
    if (reduce) { return; }
    var fx = $('#fx');
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'h'; s.textContent = '♥';
      s.style.left = (Math.random() * 100) + '%';
      s.style.fontSize = (14 + Math.random() * 22) + 'px';
      s.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      s.style.setProperty('--dur', (3.6 + Math.random() * 3) + 's');
      s.style.setProperty('--dl', (Math.random() * 1.2) + 's');
      s.style.setProperty('--dx', ((Math.random() - 0.5) * 140) + 'px');
      fx.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 8500); })(s);
    }
  }
  function bits(x, y, color) {
    var fx = $('#fx');
    for (var i = 0; i < 9; i++) {
      var b = document.createElement('span'), a = (i / 9) * Math.PI * 2, r = 40 + Math.random() * 30;
      b.className = 'bit'; b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.setProperty('--c', color);
      b.style.setProperty('--dx', Math.cos(a) * r + 'px'); b.style.setProperty('--dy', Math.sin(a) * r + 'px');
      fx.appendChild(b);
      (function (el) { setTimeout(function () { el.remove(); }, 700); })(b);
    }
  }

  /* ---------- Balloons ---------- */
  var POS = [[6,4],[30,18],[56,2],[78,20],[14,40],[44,44],[70,52]];
  var popped = 0;
  function buildBalloons() {
    var field = $('#field'); field.innerHTML = ''; popped = 0;
    POS.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'balloon'; b.setAttribute('aria-label', 'Balloon ' + (i + 1));
      b.style.left = p[0] + '%'; b.style.top = p[1] + '%';
      b.style.setProperty('--c', COLORS[i % COLORS.length]); b.style.setProperty('--d', (i * 0.35) + 's');
      b.addEventListener('click', function () {
        if (b.classList.contains('pop')) { return; }
        b.classList.add('pop'); popSound();
        var r = b.getBoundingClientRect(); bits(r.left + r.width / 2, r.top + r.height / 2, COLORS[i % COLORS.length]);
        popped++; updateLeft();
      });
      field.appendChild(b);
    });
    updateLeft();
  }
  function updateLeft() {
    var left = POS.length - popped, el = $('#left');
    if (left > 0) { el.textContent = left === POS.length ? 'Pop all ' + left + '.' : left + ' to go.'; }
    else { el.textContent = 'Every one popped.'; hearts(26); setTimeout(function () { show('cake'); resetCake(); }, 1100); }
  }

  /* ---------- Cake ---------- */
  var CANDLE_X = [125, 152, 180, 208, 235], celebrated = false;
  function buildCandles() {
    var g = $('#candles'); g.innerHTML = '';
    var NS = 'http://www.w3.org/2000/svg';
    CANDLE_X.forEach(function (x, i) {
      var c = document.createElementNS(NS, 'g');
      c.setAttribute('class', 'candle'); c.setAttribute('transform', 'translate(' + x + ' 124)');
      c.setAttribute('tabindex', '0'); c.setAttribute('role', 'button'); c.setAttribute('aria-label', 'Blow out candle ' + (i + 1));
      c.innerHTML =
        '<rect x="-15" y="-70" width="30" height="76" fill="transparent"/>' +
        '<rect x="-4" y="-38" width="8" height="38" rx="2" fill="' + (i % 2 ? '#fbeee9' : '#eaa3b8') + '"/>' +
        '<rect x="-4" y="-30" width="8" height="4" fill="rgba(0,0,0,.12)"/><rect x="-4" y="-18" width="8" height="4" fill="rgba(0,0,0,.12)"/>' +
        '<g transform="translate(0 -38)"><path class="flame" d="M0 -3 C-6 -9 -3 -17 0 -24 C3 -17 6 -9 0 -3 Z" fill="#ffd27a"/></g>' +
        '<path class="smoke" d="M0 -44 q-6 -9 0 -17 q6 -8 0 -16" stroke="#f8eaef" stroke-width="2" fill="none" stroke-linecap="round"/>';
      c.addEventListener('click', function () { blowOne(c); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blowOne(c); } });
      g.appendChild(c);
    });
  }
  function allOut() { return document.querySelectorAll('.candle:not(.out)').length === 0; }
  function blowOne(c) {
    if (c.classList.contains('out')) { return; }
    if (document.querySelectorAll('.candle.out').length === 0) { whoosh(); }
    c.classList.add('out');
    if (allOut()) { celebrate(); }
  }
  function celebrate() {
    if (celebrated) { return; }
    celebrated = true;
    $('#blowBtn').hidden = true;
    $('#cakeHint').textContent = 'Make a wish, Prerna.';
    hearts(40); playTune();
    setTimeout(function () { $('#candles').classList.add('gone'); }, 2200);
    setTimeout(function () { $('#cakeHint').textContent = 'Now cut the cake.'; $('#cutBtn').hidden = false; }, 3000);
  }
  function resetCake() {
    celebrated = false; buildCandles();
    $('#candles').classList.remove('gone');
    $('#slice').classList.remove('out'); $('#gapFace').classList.remove('on');
    ['#k1', '#k2'].forEach(function (k) { $(k).classList.remove('draw'); });
    $('#blowBtn').hidden = false; $('#cutBtn').hidden = true; $('#letterBtn').hidden = true;
    $('#cakeHint').textContent = 'Tap the candles, or blow them all out.';
  }
  $('#blowBtn').addEventListener('click', function () {
    var cs = Array.prototype.slice.call(document.querySelectorAll('.candle'));
    cs.forEach(function (c, i) { setTimeout(function () { blowOne(c); }, i * 140); });
  });
  $('#cutBtn').addEventListener('click', function () {
    $('#cutBtn').hidden = true;
    $('#k1').classList.add('draw'); $('#k2').classList.add('draw'); chime();
    setTimeout(function () { $('#gapFace').classList.add('on'); $('#slice').classList.add('out'); }, 750);
    setTimeout(function () { $('#cakeHint').textContent = 'Blueberry cheesecake, for the birthday girl.'; hearts(20); }, 1500);
    setTimeout(function () { $('#letterBtn').hidden = false; }, 2300);
  });
  $('#letterBtn').addEventListener('click', function () { buildLetter(); show('letter'); hearts(24); });

  /* ---------- Letter ---------- */
  var LETTER = [
    'Happy Birthday, my love.',
    'You are beautiful, you feel everything deeply, and you keep smiling even on the days that ask a lot of you.',
    'Whenever I plan a little surprise for you, I am really waiting for one moment: the smile that spreads across your face. It is a different smile from all the others, and I never get tired of seeing it. I would plan a thousand surprises just to see it one more time.',
    'In a few months you will be my wife. I cannot wait to see that smile every morning for the rest of my life.',
    'Today belongs to you. I hope it is full of sweet things, starting with this blueberry cheesecake, and that every one of them makes you smile that smile.'
  ];
  function buildLetter() {
    var p = $('#paper'), i = 0, html = '<p class="date">12 October</p><h2 class="to line" style="--i:' + (i++) + '">My dearest Prerna,</h2>';
    LETTER.forEach(function (t) { html += '<p class="line" style="--i:' + (i++) + '">' + t + '</p>'; });
    html += '<p class="sign line" style="--i:' + (i++) + '">Always yours,<strong>Arpit</strong></p>';
    p.innerHTML = html;
  }
  $('#replayBtn').addEventListener('click', function () { initAudio(); playTune(); hearts(14); });
  $('#againBtn').addEventListener('click', function () { show('balloons'); buildBalloons(); });

  /* ---------- Start + mute ---------- */
  $('#openBtn').addEventListener('click', function () {
    initAudio(); chime();
    $('#mute').hidden = false;
    show('balloons'); buildBalloons(); hearts(12);
  });
  $('#mute').addEventListener('click', function () {
    muted = !muted; if (master) { master.gain.value = muted ? 0 : 0.7; }
    this.textContent = muted ? 'Sound off' : 'Sound on';
  });
  buildCandles();
})();
</script>

</body>
